                    step.tool_calls.forEach(function(tool, tIdx) {
                        let toolId = pId + '_tool_' + tIdx;
                        let isSubagent = tool.name === 'invoke_subagent';
                        let toolX = startToolX + (tIdx * 280);

                        // Pair this call with the GENERIC step that carried its output.
                        const resSteps = resultsFor[step.step_index];
                        const resultStep = resSteps && resSteps[tIdx] ? resSteps[tIdx] : null;
                        const resultText = resultStep ? (resultStep.content || '') : '';
                        const failed = isFailure(resultText, tool.name);
                        const running = step.status === 'RUNNING' || (!resultStep && step.status !== 'DONE');
                        const tTiming = parseTiming(resultText, step, resultStep);

                        // Tally on every pass, not just when the node is first drawn.
                        // Nodes persist across polls, but `turns` and `issueNodes` are
                        // rebuilt from scratch each time, so doing this inside the
                        // creation guard below made the counts correct on the first
                        // paint and zero on every poll after it.
                        const tSummaryObj = summarizeResult(resultText, tool.name, failed);
                        if (failed) {
                            // Carry enough context to describe the failure in a list,
                            // so the user can see what broke without visiting each node.
                            issueNodes.push({
                                id: toolId, x: toolX, kind: 'tool', tool: tool.name,
                                requestNum: currentTurn ? currentTurn.num : 0,
                                detail: tSummaryObj ? tSummaryObj.headline : 'Failed',
                                time: step.created_at || null
                            });
                        }
                        if (currentTurn && currentTurn.tools) {
                            currentTurn.tools.push({
                                name: tool.name, failed: failed, running: running,
                                ms: tTiming ? tTiming.ms : null,
                                summary: tSummaryObj
                            });
                        }

                        // Transcript schemas differ: newer logs use `args`, older use `arguments`
                        let targs = tool.arguments || tool.args || {};
                        if (tTiming && tTiming.ms >= SLOW_MS) {
                            slowNodes.push({
                                id: toolId, x: toolX, tool: tool.name,
                                ms: tTiming.ms,
                                requestNum: currentTurn ? currentTurn.num : 0,
                                detail: targs.toolSummary || (tSummaryObj && tSummaryObj.headline) || extractFallbackSummary(targs),
                                time: step.created_at || null
                            });
                        }
                        let tSummary = wrapText(truncate(targs.toolSummary ? targs.toolSummary : extractFallbackSummary(targs), 45), 28);
                        let title = isSubagent ? '🤖 SUBAGENT: ' + (targs.TypeName||'Task') : '🔧 TOOL: ' + tool.name;
                        const basePal = isSubagent ? pal.subagent : pal.tool;
                        let color = { background: basePal.bg, border: basePal.border };
                        let fontColor = basePal.font;

                        if (failed) {
                            title = '⛔ FAILED: ' + tool.name;
                            color = { background: pal.error.bg, border: pal.error.border };
                            fontColor = pal.error.font;
                        } else if (running) {
                            title = '⏳ RUNNING: ' + tool.name;
                            color = { background: pal.running.bg, border: pal.running.border };
                            fontColor = pal.running.font;
                        }

                        // Surface slow calls on the node itself so bottlenecks
                        // are visible without opening every step.
                        if (tTiming && tTiming.ms >= SLOW_MS) title += '  🐢 ' + formatDuration(tTiming.ms);

                        const visual = { id: toolId, label: title + '\n' + tSummary, shape: 'box', color: color,
                            font: { color: fontColor, align: 'left', multi: false },
                            shapeProperties: running ? { borderDashes: [5, 4] } : { borderDashes: false },
                            x: toolX, y: isSubagent ? Y_AGENT : Y_TOOL };

                        const prior = rawDataMap[toolId];
                        if (!nodes.get(toolId)) {
                            newNodes.push(visual);
                            // Collapsed steps get a dotted edge to signal a skipped router round-trip.
                            if (anchorId) newEdges.push({ from: anchorId, to: toolId, arrows: 'to, from', color: { color: pal.toolEdge }, width: 2, dashes: collapse ? [2, 4] : false });
                        } else if (prior && (prior.running !== running || prior.failed !== failed)) {
                            // A call drawn while in flight would otherwise stay amber
                            // and dashed forever, since the node already exists.
                            nodes.update(visual);
                        }
                        rawDataMap[toolId] = { type: 'TOOL_CALL', step: step, tool: tool, result: resultText, resultStep: resultStep, failed: failed, running: running };

                        if (isSubagent) previousPlannerId = toolId;
                    });
                    
                    let toolsTotalX = startToolX + (step.tool_calls.length * 280) - 100;
                    if (toolsTotalX > currentX) currentX = toolsTotalX;
                    currentTurn.maxX = currentX;
                }
            }
        });
        
        if (currentTurn) turns.push(currentTurn);
        window.graphTurns = turns;
        
        let nodesAdded = (newNodes.length > 0);
        if (nodesAdded) nodes.add(newNodes);
        if (newEdges.length > 0) edges.add(newEdges);
        
        if (nodesAdded && !InitialLayoutDone) {
            InitialLayoutDone = true;
            setTimeout(() => { network.moveTo({ position: { x: -50, y: 0 }, scale: 1.0, animation: false }); }, 50);
        } else if (nodesAdded && autoFollow && InitialLayoutDone) {
            // Find max X to auto-scroll gracefully to the leading edge of the workflow trace!
            let maxX = -50;
            nodes.forEach(n => { if (n.x > maxX) maxX = n.x; });
            network.moveTo({
                position: { x: maxX - 200, y: 0 },
                scale: currentZoom,
                animation: { duration: 600, easingFunction: 'easeInOutQuad' }
            });
        }

        renderScrubber();
        renderGoalOptions();
        syncViewportUI();
        refreshIssueButton();
        // The inspector is dead space until something is clicked; fill it with a
        // session summary, and keep it fresh as new steps stream in.
        if (!hasSelection) renderOverview();
        // Newly added nodes must inherit the active filter, not appear fully lit.
        if (searchTerm.trim()) applySearch();
    }

    // The compact transcript abbreviates long fields and lists them in
    // `truncated_fields`. Surface that instead of silently showing a partial value.
    function truncationNotice(step) {
        if (!step || !step.truncated_fields || !step.truncated_fields.length) return '';
        const fields = step.truncated_fields.join(', ');
        return '<div style="margin-top:8px; font-size:12px; color:#996C00; background:#FEF7E0; border:1px solid #F9AB00; border-radius:6px; padding:8px 10px;">' +
               '⚠ Abbreviated in this log (' + fields + '). ' +
               '<a href="#" onclick="window.loadFullStep(' + step.step_index + '); return false;" style="color:#1a73e8; font-weight:600;">Load full version</a></div>';
    }

    // Fetches the untruncated step and drops it into the inspector.
    window.loadFullStep = async function(stepIndex) {
        try {
            const res = await fetch(`/api/step_full?conversationId=${encodeURIComponent(activeConvId)}&step=${stepIndex}`);
            if (!res.ok) throw new Error(await res.text());
            const full = await res.json();
            if (!full || full.step_index === undefined) {
                alert('Full version not available for this step.');
                return;
            }
            renderInspector(full.type === 'GENERIC' ? { type: 'TOOL_CALL', step: full, tool: { name: 'result', args: {} }, result: full.content || '', resultStep: null } : full);
        } catch (e) {
            console.error('Failed to load full step:', e);
        }
    };

    // ---------------------------------------------------------------------
    // Timing
    // ---------------------------------------------------------------------
    // The runtime prefixes most tool results with `Created At:` / `Completed At:`
    // ISO timestamps. That is a far more precise source for how long a tool
    // actually took than diffing the surrounding step timestamps, so prefer it
    // and only fall back to step metadata when the preamble is absent.
    function parseTiming(rawText, step, resultStep) {
        let start = null, end = null;
        if (rawText) {
            const c = rawText.match(/^\s*Created At:\s*(\S+)/m);
            const d = rawText.match(/^\s*Completed At:\s*(\S+)/m);
            if (c) start = Date.parse(c[1]);
            if (d) end = Date.parse(d[1]);
        }
        if ((!start || !end) && step && resultStep && step.created_at && resultStep.created_at) {
            start = Date.parse(step.created_at);
            end = Date.parse(resultStep.created_at);
        }
        if (!start || !end || isNaN(start) || isNaN(end) || end < start) return null;
        return { start: start, end: end, ms: end - start };
    }

    function formatDuration(ms) {
        if (ms < 1000) return ms + 'ms';
        if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's';
        const mins = Math.floor(ms / 60000);
        return mins + 'm ' + Math.round((ms % 60000) / 1000) + 's';
    }

    // Anything past this is worth calling out visually as a bottleneck.
    const SLOW_MS = 10000;

    // A silence longer than this between a step and the next request is worth
    // marking. Traces here span weeks, so "later" is real context, not noise.
    const GAP_MS = 6 * 60 * 60 * 1000;

    function formatGap(ms) {
        const days = Math.floor(ms / 86400000);
        if (days >= 1) return days + (days === 1 ? ' day' : ' days');
        return Math.round(ms / 3600000) + ' hours';
    }

    function formatStamp(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d)) return '';
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Decides whether a tool call actually failed.
    //
    // Results never *begin* with "Error": the `Created At:` preamble comes first,
    // and tools state trouble mid-text. A leading-keyword regex therefore matched
    // zero of 402 real results while missing 11 non-zero exits — i.e. it reported
    // a clean run every time. Match how each tool genuinely reports failure, and
    // stay conservative: a bare mention of "error" is not enough, because it turns
    // up constantly in file contents and search hits the agent is merely reading.
    function isFailure(rawText, toolName) {
        const text = stripTimingPreamble(rawText || '');
        if (!text.trim()) return false;

        // Runtime-level errors and cancellations are prefixed.
        if (/^\s*(Error|Encountered error|Failed|Tool execution was canceled)\b/i.test(text)) return true;
        if (/\bwas canceled with result\b/i.test(text)) return true;

        if (toolName === 'run_command') {
            // Everything after `Output:` is captured stdout, which routinely
            // contains phrases like "exited with code 1" (build logs, test
            // output, this tool's own traces). Only the status header above it
            // describes *this* call, so read the code from there.
            const head = text.split(/\nOutput:/)[0];
            const m = head.match(/command exited with code\s*(-?\d+)/i);
            if (m) return m[1] !== '0';
            if (/\b(permission denied|read-only file system)\b/i.test(head)) return true;
            return false;
        }

        // An edit whose target never matched leaves the file untouched. A
        // successful edit echoes the diff, and that diff can itself contain the
        // failure wording, so trust the success banner first.
        if (toolName === 'replace_file_content') {
            if (/following changes were made by the replace_file_content tool/i.test(text)) return false;
            if (/did not appear in|no changes were made/i.test(text)) return true;
        }

        return false;
    }

    // The `Created At:` / `Completed At:` lines are plumbing, not content.
    // Strip them so the displayed body starts with the actual output.
    function stripTimingPreamble(text) {
        return (text || '').replace(/^\s*(Created|Completed) At:.*\n?/gm, '');
    }

    // ---------------------------------------------------------------------
    // Result summarisation
    // ---------------------------------------------------------------------
    // Raw tool output is long and noisy. Distil it into one plain-English
    // sentence plus a handful of stat chips, so the trace stays readable for
    // people who are not going to read a 4000-character dump.
    function summarizeResult(rawText, toolName, failed) {
        const text = stripTimingPreamble(rawText || '');
        if (!text.trim()) return null;

        const stats = [];
        const grab = (re) => { const m = text.match(re); return m ? m[1] : null; };
        // Captured paths usually sit inside a sentence, so trailing punctuation
        // comes along for the ride and has to be trimmed off.
        const base = (p) => p ? p.replace(/[`'"]/g, '').replace(/^file:\/\//, '')
                                 .replace(/[.,;:)]+$/, '').split('/').filter(Boolean).pop() : null;
        const firstLine = text.trim().split('\n')[0].trim();
        let headline = null;

        if (failed) {
            // For failures the error text itself is the most useful summary.
            const errLine = text.split('\n').map(l => l.trim())
                                .find(l => /error|failed|denied|not found|cannot|unable/i.test(l)) || firstLine;
            headline = truncate(errLine, 200);
        } else {
            switch (toolName) {
                case 'view_file': {
                    const path = grab(/File Path:\s*(.+)/);
                    const shown = text.match(/Showing lines (\d+) to (\d+)/);
                    const total = grab(/Total Lines:\s*(\d+)/);
                    const bytes = grab(/Total Bytes:\s*(\d+)/);
                    headline = 'Read ' + (shown ? 'lines ' + shown[1] + '–' + shown[2] + ' of ' : '') + (base(path) || 'a file') + '.';
                    if (total) stats.push(total + ' lines total');
                    if (bytes) stats.push(Math.round(bytes / 102.4) / 10 + ' KB');
                    break;
                }
                case 'write_to_file': {
                    const path = grab(/Created file\s+(\S+)/);
                    headline = 'Created ' + (base(path) || 'a new file') + '.';
                    break;
                }
                case 'replace_file_content': {
                    const path = grab(/tool to:\s*(\S+)/);
                    const added = (text.match(/^\+(?!\+)/gm) || []).length;
                    const removed = (text.match(/^-(?!-)/gm) || []).length;
                    headline = 'Edited ' + (base(path) || 'a file') + '.';
                    if (added) stats.push(added + ' lines added');
                    if (removed) stats.push(removed + ' lines removed');
                    break;
                }
                case 'run_command': {
                    const task = grab(/background task with task id:\s*(\S+)/);
                    const code = grab(/command exited with code\s*(-?\d+)/i);
                    if (task) {
                        headline = 'Started a background task (' + task + ').';
                    } else if (code !== null) {
                        headline = code === '0' ? 'Command completed successfully.'
                                                : 'Command finished with exit code ' + code + '.';
                    } else {
                        headline = 'Ran a shell command.';
                    }
                    const outLines = text.split('\n').length;
                    if (outLines > 3) stats.push(outLines + ' lines of output');
                    break;
                }
                case 'code_search': {
                    const n = grab(/([\d,]+)\s+files? found/);
                    headline = n ? 'Found ' + n + ' matching files in the codebase.' : 'Searched the codebase.';
                    break;
                }
                case 'grep_search': {
                    const lineHits = (text.match(/"LineNumber"/g) || []).length;
                    const fileSet = new Set((text.match(/"(?:Filename|File)"\s*:\s*"([^"]+)"/g) || []));
                    const fileHits = fileSet.size;
                    if (lineHits > 0) {
                        headline = 'Found ' + lineHits + ' matching line' + (lineHits === 1 ? '' : 's') +
                                   (fileHits ? ' across ' + fileHits + ' file' + (fileHits === 1 ? '' : 's') : '') + '.';
                    } else if (fileHits > 0) {
                        headline = 'Found matches in ' + fileHits + ' file' + (fileHits === 1 ? '' : 's') + '.';
                    } else {
                        headline = 'No matches found.';
                    }
                    break;
                }
                case 'ask_question': {
                    const ans = grab(/A1:\s*(.+)/);
                    headline = ans ? 'User answered: “' + truncate(ans.trim(), 120) + '”'
                                   : 'Asked the user a clarifying question.';
                    break;
                }
                case 'invoke_subagent': {
                    headline = 'Delegated task to a subagent and received its report.';
                    break;
                }
                case 'find_by_name': {
                    // Newer output states the count outright; older output just lists paths.
                    let n = grab(/Found\s+(\d+)\s+results?/i);
                    if (!n) {
                        const listed = text.split('\n').filter(l => /^\s*(file|dir|directory)\b|\//.test(l)).length;
                        n = listed ? String(listed) : null;
                    }
                    headline = n ? 'Found ' + n + ' matching file' + (n === '1' ? '' : 's') + '.' : 'No matching files found.';
                    break;
                }
                case 'list_dir': {
                    headline = grab(/(Summary:\s*This directory.*)/) || 'Listed a directory.';
                    headline = headline.replace(/^Summary:\s*/, '');
                    break;
                }
                case 'generate_image': {
                    const p = grab(/saved to:?\s*(\S+)/i) || grab(/(\S+\.(?:png|jpg|jpeg|webp))/i);
                    headline = p ? 'Generated image ' + base(p) + '.' : 'Generated an image.';
                    break;
                }
                case 'manage_task': {
                    const cancelled = grab(/Task\s+"([^"]+)"\s+cancelled/i);
                    const status = grab(/^Status:\s*(\S+)/m);
                    if (cancelled) headline = 'Cancelled background task ' + cancelled + '.';
                    else if (status) headline = 'Background task status: ' + status + '.';
                    else headline = truncate(firstLine, 200);
                    break;
                }
                default:
                    headline = truncate(firstLine, 200);
            }
        }

        if (!headline || !headline.trim()) headline = truncate(firstLine, 200);

        // Only show a raw size when no more meaningful size stat was produced.
        const chars = text.trim().length;
        if (chars > 600 && !stats.some(s => /KB|characters/.test(s))) {
            stats.push(Math.round(chars / 100) / 10 + 'k characters');
        }

        return { headline: headline, stats: stats, body: text.trim() };
    }

    // --- Session overview --------------------------------------------------
    // The inspector sat empty until a node was clicked. A run summary is more
    // useful there, and answers "what happened in this session?" for someone
    // who isn't going to read the graph node by node.
    let hasSelection = false;

    function computeRunStats() {
        const turns = window.graphTurns || [];
        const steps = window.lastTranscript || [];
        const stats = { requests: 0, steps: steps.length, tools: 0, failed: 0,
                        slow: 0, running: 0, totalMs: 0, byTool: {}, first: null, last: null };

        turns.forEach(t => {
            if (t.num > 0) stats.requests++;
            t.tools.forEach(tool => {
                stats.tools++;
                if (tool.failed) stats.failed++;
                if (tool.running) stats.running++;
                if (tool.ms) { stats.totalMs += tool.ms; if (tool.ms >= SLOW_MS) stats.slow++; }
                stats.byTool[tool.name] = (stats.byTool[tool.name] || 0) + 1;
            });
        });

        steps.forEach(s => {
            if (!s.created_at) return;
            const t = Date.parse(s.created_at);
            if (isNaN(t)) return;
            if (stats.first === null || t < stats.first) stats.first = t;
            if (stats.last === null || t > stats.last) stats.last = t;
        });
        return stats;
    }

    function renderOverview() {
        if (!inspectorEl) return;
        hasSelection = false;
        const s = computeRunStats();
        if (!s.steps) return;

        const tile = (label, value, accent, idAttr, hint) =>
            '<div' + (idAttr ? ' id="' + idAttr + '" class="ov-tile-btn" title="' + (hint || '') + '"' : '') +
            ' style="flex:1 1 44%; min-width:120px; background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-radius:8px; padding:12px;">' +
            '<div style="font-size:20px; font-weight:700; color:' + (accent || 'var(--foreground,#202124)') + ';">' + value + '</div>' +
            '<div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted-foreground,#80868b); margin-top:2px;">' +
            '<span>' + label + '</span>' + (idAttr ? '<span style="font-size:10px; color:var(--primary,#1a73e8); text-transform:none; font-weight:600;">View →</span>' : '') + '</div></div>';

        let html = '<div id="inspector-title" style="color:#1967D2">📊 SESSION OVERVIEW</div>';

        html += '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">' +
                tile('Requests', s.requests) +
                tile('Tool calls', s.tools) +
                tile('Failed', s.failed, s.failed ? '#D93025' : undefined, s.failed ? 'ovTileFailed' : null, 'Browse failed steps') +
                tile('Slow (>10s)', s.slow, s.slow ? '#F9AB00' : undefined, s.slow ? 'ovTileSlow' : null, 'Browse slowest tool calls') +
                '</div>';

        html += '<div class="inspector-section"><div class="inspector-label">Time</div>';
        html += '<div style="font-size:13px; color:var(--foreground,#202124); line-height:1.8;">' +
                '<div>Working time in tools: <strong>' + formatDuration(s.totalMs) + '</strong></div>';
        if (s.first && s.last) {
            html += '<div>Spans: <strong>' + formatStamp(new Date(s.first).toISOString()) +
                    '</strong> → <strong>' + formatStamp(new Date(s.last).toISOString()) + '</strong></div>' +
                    '<div style="color:var(--muted-foreground,#5f6368);">(' + formatGap(Math.max(s.last - s.first, 1)) + ' elapsed)</div>';
        }
        html += '</div></div>';

        // Which tools dominate is the quickest read on what kind of work this was.
        const ranked = Object.entries(s.byTool).sort((a, b) => b[1] - a[1]).slice(0, 6);
        if (ranked.length) {
            const max = ranked[0][1];
            html += '<div class="inspector-section"><div class="inspector-label">Most used tools</div>';
            ranked.forEach(([name, n]) => {
                html += '<div style="margin-bottom:6px;">' +
                        '<div style="display:flex; justify-content:space-between; font-size:12px; color:var(--foreground,#202124);">' +
                        '<span>' + escapeHtml(name) + '</span><span style="color:var(--muted-foreground,#80868b);">' + n + '</span></div>' +
                        '<div style="height:5px; background:var(--secondary,#e8eaed); border-radius:3px; overflow:hidden; margin-top:3px;">' +
                        '<div style="height:100%; width:' + Math.round((n / max) * 100) + '%; background:#4285F4;"></div></div></div>';
            });
            html += '</div>';
        }

        html += '<div class="empty-state" style="margin-top:24px; font-size:13px;">Select any node to inspect it, or click Failed / Slow above to drill in.</div>';
        inspectorEl.innerHTML = html;

        const tileFailed = document.getElementById('ovTileFailed');
        if (tileFailed) tileFailed.addEventListener('click', () => renderIssuesPanel());
        const tileSlow = document.getElementById('ovTileSlow');
        if (tileSlow) tileSlow.addEventListener('click', () => renderSlowPanel());
    }
    window.showOverview = renderOverview;

    // --- Slowest calls (bottleneck browser) ----------------------------------
    function renderSlowPanel() {
        if (!inspectorEl) return;
        hasSelection = true;

        let html = '<div id="inspector-title" style="color:#B06000">🐢 SLOWEST TOOL CALLS</div>';
        if (!slowNodes.length) {
            html += '<div class="empty-state" style="font-size:13px;">No tool calls took 10s or longer in this trace.</div>';
            inspectorEl.innerHTML = html;
            return;
        }

        const sorted = slowNodes.slice().sort((a, b) => b.ms - a.ms);
        html += '<div class="inspector-section"><div class="inspector-label">' +
                sorted.length + ' call' + (sorted.length === 1 ? '' : 's') +
                ' ≥ 10s (ranked slowest first) — click one to jump to it</div>';
        sorted.forEach((item, i) => {
            html += '<button class="issue-row slow-row" data-slow="' + i + '">' +
                    '<span class="req">' + formatDuration(item.ms) + '</span>' +
                    '<span class="body"><span class="tool">' + escapeHtml(item.tool) +
                    (item.requestNum ? ' <span class="when" style="font-weight:400;">· Req #' + item.requestNum + '</span>' : '') +
                    '</span>' +
                    '<span class="detail">' + escapeHtml(item.detail || '') +
                    (item.time ? ' <span class="when">· ' + formatStamp(item.time) + '</span>' : '') +
                    '</span></span></button>';
        });
        html += '</div>';
        inspectorEl.innerHTML = html;

        inspectorEl.querySelectorAll('.slow-row').forEach(row => {
            row.addEventListener('click', () => {
                const i = parseInt(row.dataset.slow, 10);
                const target = sorted[i];
                if (!target) return;
                jumpToX(target.x);
                inspectorEl.querySelectorAll('.slow-row').forEach(r =>
                    r.classList.toggle('active', r === row));
            });
            row.addEventListener('dblclick', () => {
                const target = sorted[parseInt(row.dataset.slow, 10)];
                if (target && rawDataMap[target.id]) renderInspector(rawDataMap[target.id]);
            });
        });
    }
    window.showSlow = renderSlowPanel;

    // --- Issue list ----------------------------------------------------------
    // Cycling one button meant you could only ever see a single failure, with
    // no idea how many were left or where they sat. List them all instead.
    function renderIssuesPanel() {
        if (!inspectorEl) return;
        hasSelection = true;

        let html = '<div id="inspector-title" style="color:#D93025">⛔ FAILURES</div>';
        if (!issueNodes.length) {
            html += '<div class="empty-state" style="font-size:13px;">' +
                    'Nothing failed in this trace.</div>';
            inspectorEl.innerHTML = html;
            return;
        }

        html += '<div class="inspector-section"><div class="inspector-label">' +
                issueNodes.length + (issueNodes.length === 1 ? ' failure' : ' failures') +
                ' — click one to jump to it</div>';
        issueNodes.forEach((iss, i) => {
            html += '<button class="issue-row' + (i === issueCursor ? ' active' : '') +
                    '" data-issue="' + i + '">' +
                    '<span class="req">' + (iss.requestNum ? '#' + iss.requestNum : '—') + '</span>' +
                    '<span class="body"><span class="tool">' + escapeHtml(iss.tool) + '</span>' +
                    '<span class="detail">' + escapeHtml(iss.detail || '') +
                    (iss.time ? ' <span class="when">· ' + formatStamp(iss.time) + '</span>' : '') +
                    '</span></span></button>';
        });
        html += '</div>';
        inspectorEl.innerHTML = html;

        inspectorEl.querySelectorAll('.issue-row').forEach(row => {
            row.addEventListener('click', () => {
                const i = parseInt(row.dataset.issue, 10);
                const target = issueNodes[i];
                if (!target) return;
                issueCursor = i;
                jumpToX(target.x);
                highlightIssue(i);
                // Keep the list on screen; selecting a row shouldn't replace it
                // with the node inspector and lose the user's place.
                inspectorEl.querySelectorAll('.issue-row').forEach(r =>
                    r.classList.toggle('active', r === row));
            });
            row.addEventListener('dblclick', () => {
                const target = issueNodes[parseInt(row.dataset.issue, 10)];
                if (target && rawDataMap[target.id]) renderInspector(rawDataMap[target.id]);
            });
        });
    }
    window.showIssues = renderIssuesPanel;

    // --- Keyboard legend -----------------------------------------------------
    // Shortcuts that nobody can discover are shortcuts nobody uses.
    const SHORTCUTS = [
        { keys: ['←', '→'],        what: 'Previous / next request' },
        { keys: ['/'],             what: 'Jump to the search box' },
        { keys: ['Enter'],         what: 'Next search match (while in the search box)' },
        { keys: ['⇧', 'Enter'],    what: 'Previous search match', join: '+' },
        { keys: ['Esc'],           what: 'Clear the search' },
        { keys: ['n'],             what: 'Next failure' },
        { keys: ['s'],             what: 'Slowest tool calls (≥10s)' },
        { keys: ['o'],             what: 'Session overview' },
        { keys: ['d'],             what: 'Toggle dark / light mode' },
        { keys: ['?'],             what: 'This list' },
    ];

    function renderShortcuts() {
        if (!inspectorEl) return;
        hasSelection = true;
        let html = '<div id="inspector-title">⌨ KEYBOARD SHORTCUTS</div>' +
                   '<div class="inspector-section">';
        SHORTCUTS.forEach(s => {
            const keys = s.keys.map(k => '<kbd>' + escapeHtml(k) + '</kbd>')
                               .join(s.join === '+' ? '<span class="sep">+</span>' : '');
            html += '<div class="key-row"><span class="keys">' + keys + '</span>' +
                    '<span class="what">' + escapeHtml(s.what) + '</span></div>';
        });
        html += '</div><div class="inspector-label" style="margin-top:14px; text-transform:none; ' +
                'letter-spacing:0; font-weight:400;">Shortcuts are ignored while you are typing in a ' +
                'field, so the search box still behaves normally.</div>';
        inspectorEl.innerHTML = html;
    }
    window.showShortcuts = renderShortcuts;

    // Shared with the overview; renderInspector defines its own local copy.
    function escapeHtml(unsafe) {
        return unsafe ? unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;")
                              .replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }

    // --- Export ------------------------------------------------------------
    // Turns the active request into markdown someone can paste into a doc or
    // a message, which is the usual way this trace gets shared onward.
    function requestAsMarkdown(turn) {
        if (!turn) return '';
        const lines = [];
        lines.push('## Request ' + (turn.num > 0 ? turn.num : '(session start)'));
        if (turn.time) lines.push('_' + formatStamp(turn.time) + '_');
        lines.push('');
        lines.push('**Asked:** ' + turn.request);
        if (turn.intent) lines.push('**Agent\'s plan:** ' + turn.intent);
        lines.push('');
        if (turn.tools.length) {
            lines.push('### What the agent did (' + turn.tools.length + ' tool calls)');
            turn.tools.forEach(t => {
                const mark = t.failed ? '❌' : (t.running ? '⏳' : '✅');
                const dur = t.ms ? ' _(' + formatDuration(t.ms) + ')_' : '';
                const what = t.summary ? t.summary.headline : '';
                lines.push('- ' + mark + ' **' + t.name + '**' + dur + (what ? ' — ' + what : ''));
            });
            const failed = turn.tools.filter(t => t.failed).length;
            if (failed) { lines.push(''); lines.push('> ' + failed + ' of these failed.'); }
        } else {
            lines.push('_No tool calls in this request._');
        }
        if (turn.reply) {
            lines.push('');
            lines.push('### Answer');
            lines.push(turn.reply);
        }
        return lines.join('\n');
    }

    // Copying from this panel is awkward: it runs in an iframe, so
    // navigator.clipboard is usually missing or rejected for want of a
    // clipboard-write permission.
    //
    // Order matters here. execCommand('copy') requires the browser's "user
    // activation" from the click that triggered it, and *awaiting* the async
    // clipboard API first consumes that activation -- so trying the modern API
    // first silently guarantees the fallback fails too. Run the synchronous
    // path first, while the gesture is still live.
    function copySync(text) {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed; top:0; left:-9999px; opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, text.length);
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (e) {
            return false;
        }
    }

    // Last resort: put the text on screen, pre-selected, so the user can still
    // get it out with Ctrl+C instead of hitting a dead end.
    function showCopyFallback(text) {
        if (!inspectorEl) return;
        hasSelection = true;
        inspectorEl.innerHTML =
            '<div id="inspector-title" style="color:#F9AB00">📋 COPY MANUALLY</div>' +
            '<div class="inspector-section"><div class="inspector-label">' +
            'This panel is not allowed to write to the clipboard. The text is selected below — press Ctrl+C.' +
            '</div><textarea id="copyFallbackBox" style="width:100%; height:340px; font-family:monospace; ' +
            'font-size:11px; padding:8px; box-sizing:border-box; border:1px solid var(--border,#dadce0); ' +
            'border-radius:6px; background:var(--secondary,#f8f9fa); color:var(--foreground,#202124);">' +
            escapeHtml(text) + '</textarea></div>';
        const box = document.getElementById('copyFallbackBox');
        if (box) { box.focus(); box.select(); }
    }

    function flashButton(btn, msg) {
        const original = btn.dataset.label || btn.textContent;
        btn.dataset.label = original;
        btn.textContent = msg;
        setTimeout(() => { btn.textContent = btn.dataset.label || original; }, 1600);
    }

    const btnExport = document.getElementById('btnExport');
    if (btnExport) {
        // Deliberately not an async function: the handler must reach copySync
        // without an intervening await.
        btnExport.addEventListener('click', () => {
            const md = requestAsMarkdown(activeGoalTurn);
            if (!md) return;
            if (copySync(md)) { flashButton(btnExport, 'Copied'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(md)
                    .then(() => flashButton(btnExport, 'Copied'))
                    .catch(() => { flashButton(btnExport, 'Copy blocked'); showCopyFallback(md); });
                return;
            }
            flashButton(btnExport, 'Copy blocked');
            showCopyFallback(md);
        });
    }

    const btnOverview = document.getElementById('btnOverview');
    if (btnOverview) btnOverview.addEventListener('click', () => {
        if (network) network.unselectAll();
        renderOverview();
    });

    // --- Keyboard shortcuts --------------------------------------------------
    // Reading a long trace is mostly repetitive navigation, so the common moves
    // get keys. Anything typed into a field must still reach that field.
    document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const el = e.target;
        const tag = el && el.tagName ? el.tagName.toLowerCase() : '';
        const typing = tag === 'input' || tag === 'textarea' || tag === 'select' ||
                       (el && el.isContentEditable);
        if (typing) return;

        switch (e.key) {
            case 'ArrowLeft':  stepRequest(-1); e.preventDefault(); break;
            case 'ArrowRight': stepRequest(1);  e.preventDefault(); break;
            case '/':
                if (searchBox) { searchBox.focus(); searchBox.select(); e.preventDefault(); }
                break;
            case 'Escape':
                if (searchBox && searchBox.value) {
                    searchBox.value = ''; searchTerm = ''; applySearch(); e.preventDefault();
                }
                break;
            case 'n': case 'N':
                if (issueNodes.length) { goToIssue(issueCursor + 1); e.preventDefault(); }
                break;
            case 's': case 'S':
                renderSlowPanel(); e.preventDefault();
                break;
            case 'o': case 'O':
                if (btnOverview) { btnOverview.click(); e.preventDefault(); }
                break;
            case 'd': case 'D':
                applyTheme(!isDarkMode, true); e.preventDefault();
                break;
            case '?':
                renderShortcuts(); e.preventDefault();
                break;
        }
    });

    const btnKeys = document.getElementById('btnKeys');
    if (btnKeys) btnKeys.addEventListener('click', () => renderShortcuts());

    function renderInspector(data) {
        hasSelection = true;
        if (!data) return;
        let text = '';
        const escapeHtmlRaw = (unsafe) => unsafe ? unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
        
        const renderMarkdown = (mdStr) => {
            if (!mdStr) return '';
            try { return marked.parse(mdStr); } 
            catch (e) { return escapeHtmlRaw(mdStr); }
        };
        
        let icon = ''; let titleColor = isDarkMode ? '#e6edf3' : '#202124';
        const errBg = isDarkMode ? '#381518' : '#FCE8E6';
        const errText = isDarkMode ? '#fca5a5' : '#A50E0E';
        const warnBg = isDarkMode ? '#33260d' : '#FEF7E0';
        const warnText = isDarkMode ? '#fde68a' : '#996C00';
        
        if (data.type === 'USER_INPUT') {
            titleColor = isDarkMode ? '#fbbf24' : '#F57C00'; icon = '👤 ';
            const rawPrompt = data.content || '';
            const cleanPrompt = cleanUserMarkdown(rawPrompt) || cleanUserText(rawPrompt) || rawPrompt;
            const imgMatch = rawPrompt.match(/The user has uploaded (\d+) image\(s\):([^\n<]+)/);
            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + ' USER REQUEST</div>';
            if (imgMatch) {
                text += '<div style="margin-bottom:12px;"><span style="display:inline-block; background:' + (isDarkMode ? '#33200d' : '#FFF3E0') + '; border:1px solid ' + (isDarkMode ? '#f59e0b' : '#FFB74D') + '; color:' + titleColor + '; font-size:11px; font-weight:600; padding:4px 9px; border-radius:12px;">📎 Attached ' + escapeHtmlRaw(imgMatch[1]) + ' image' + (imgMatch[1] === '1' ? '' : 's') + '</span></div>';
            }
            text += '<div class="inspector-section"><div class="inspector-label">What the user asked</div>' +
                     '<div class="markdown-body" style="background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-left:4px solid '+titleColor+'; border-radius:6px; padding:14px;">' + renderMarkdown(cleanPrompt) + '</div>' +
                     truncationNotice(data) + '</div>';
            if (cleanPrompt !== rawPrompt.trim()) {
                text += '<details style="margin-top:10px;"><summary style="cursor:pointer; font-size:11px; font-weight:600; color:var(--muted-foreground,#5f6368); text-transform:uppercase; letter-spacing:0.5px;">Raw prompt envelope</summary>' +
                        '<pre style="margin-top:8px; max-height:260px; overflow-y:auto;">' + escapeHtmlRaw(rawPrompt) + '</pre></details>';
            }
        } else if (data.type === 'PLANNER_RESPONSE') {
            const isFinalReply = (!data.tool_calls || data.tool_calls.length === 0) && !!(data.content && data.content.trim());
            titleColor = isFinalReply ? (isDarkMode ? '#34d399' : '#137333') : (isDarkMode ? '#c084fc' : '#8E24AA');
            icon = isFinalReply ? '💬 ' : '🧠 ';
            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + (isFinalReply ? ' AGENT REPLY' : ' MAIN AGENT (ROUTER)') + '</div>';

            const stripMd = (s) => s.replace(/[*_`#>]/g, '').replace(/\s+/g, ' ').trim();
            const firstSentences = (s, n) => stripMd(s).split(/(?<=[.!?])\s+/).filter(Boolean).slice(0, n).join(' ');

            // Always lead with a plain-English gist so non-technical readers get value.
            let gist = '';
            if (isFinalReply && data.content) gist = firstSentences(data.content, 2);
            else if (data.thinking) gist = firstSentences(data.thinking, 2);
            else if (data.content) gist = firstSentences(data.content, 2);

            let actionList = '';
            if (data.tool_calls && data.tool_calls.length) {
                data.tool_calls.forEach(function(t) {
                    const a = t.arguments || t.args || {};
                    const desc = (a.toolAction || a.toolSummary || t.name || '').toString().replace(/^"+|"+$/g, '');
                    actionList += '<li style="margin-bottom:4px;">' + escapeHtmlRaw(desc) +
                                  ' <span style="color:var(--muted-foreground,#80868b); font-size:12px;">(' + escapeHtmlRaw(t.name) + ')</span></li>';
                });
            }

            if (!gist && actionList) {
                const n = data.tool_calls.length;
                gist = 'The agent skipped visible deliberation and went straight to ' + n + ' action' + (n > 1 ? 's' : '') + '.';
            }
            if (!gist) gist = 'No reasoning or output text was recorded for this step.';

            text += '<div class="inspector-section"><div class="inspector-label">In a nutshell</div>' +
                    '<div style="background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-left:4px solid '+titleColor+'; border-radius:6px; padding:14px; font-size:14px; line-height:1.5; color:var(--foreground,#202124);">' +
                    escapeHtmlRaw(gist) + '</div></div>';

            if (actionList) {
                text += '<div class="inspector-section"><div class="inspector-label">What it decided to do</div>' +
                        '<ul style="margin:0; padding-left:20px; font-size:13px; color:var(--foreground,#202124);">' + actionList + '</ul></div>';
            }

            if (data.thinking) {
                text += '<div class="inspector-section"><div class="inspector-label">Internal Thoughts & Reasoning</div>' +
                     '<div class="markdown-body" style="background:var(--secondary, #f8f9fa); padding: 12px; border-radius: 6px; border: 1px solid var(--border, #eee);max-height: 500px; overflow-y: auto;">' + renderMarkdown(data.thinking) + '</div>' +
                     truncationNotice(data) + '</div>';
            }
            if (data.content) {
                text += '<div class="inspector-section"><div class="inspector-label">Output Message</div>' +
                     '<div class="markdown-body">' + renderMarkdown(data.content) + '</div></div>';
            }
        } else if (data.type === 'ERROR_MESSAGE') {
            titleColor = isDarkMode ? '#f87171' : '#D93025'; icon = '⛔ ';
            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + ' ERROR</div>' +
                    '<div class="inspector-section"><div class="inspector-label">What went wrong</div>' +
                    '<div style="background:'+errBg+'; border:1px solid #D93025; border-radius:6px; padding:14px; font-size:13px; color:'+errText+'; white-space:pre-wrap; word-break:break-word;">' +
                    escapeHtmlRaw(data.content || 'No detail recorded.') + '</div>' +
                    truncationNotice(data) + '</div>';
        } else if (data.type === 'CHECKPOINT') {
            titleColor = isDarkMode ? '#94a3b8' : '#5F6368'; icon = '🗜 ';
            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + ' CONTEXT CHECKPOINT</div>' +
                    '<div class="inspector-section"><div class="inspector-label">Why this exists</div>' +
                    '<div style="background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-left:4px solid #9AA0A6; border-radius:6px; padding:14px; font-size:13px; line-height:1.5;">' +
                    'The conversation grew too long for the model\'s context window, so earlier history was compressed into the summary below. Everything before this point is no longer read verbatim by the agent.</div></div>' +
                    '<div class="inspector-section"><div class="inspector-label">Summary retained</div>' +
                    '<div class="markdown-body" style="max-height:420px; overflow-y:auto;">' + renderMarkdown(data.content) + '</div>' +
                    truncationNotice(data) + '</div>';
        } else if (data.type === 'SYSTEM_MESSAGE' || data.type === 'EPHEMERAL_MESSAGE') {
            const isEph = data.type === 'EPHEMERAL_MESSAGE';
            titleColor = isDarkMode ? '#94a3b8' : '#5F6368'; icon = isEph ? '💤 ' : '📋 ';
            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + (isEph ? ' CONTEXT INJECTION' : ' SYSTEM NOTICE') + '</div>' +
                    '<div class="inspector-section"><div class="inspector-label">Why this exists</div>' +
                    '<div style="background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-left:4px solid #BDC1C6; border-radius:6px; padding:14px; font-size:13px; line-height:1.5;">' +
                    (isEph
                        ? 'Background context the platform injected for the agent to read — relevant memories, available skills, and environment details. Not written by you or the agent.'
                        : 'A notice from the platform itself, such as a restart or a state change. Not written by you or the agent.') +
                    '</div></div>' +
                    '<div class="inspector-section"><div class="inspector-label">Content</div>' +
                    '<div class="markdown-body" style="max-height:420px; overflow-y:auto;">' + renderMarkdown(data.content) + '</div>' +
                    truncationNotice(data) + '</div>';
        } else if (data.type === 'TOOL_CALL') {
            const tool = data.tool;
            const isSubagent = tool.name === 'invoke_subagent';
            titleColor = isSubagent ? (isDarkMode ? '#818cf8' : '#3F51B5') : (isDarkMode ? '#22d3ee' : '#00BCD4');
            icon = isSubagent ? '🤖 ' : '🔧 ';
            
            // Transcript schemas differ: newer logs use `args`, older use `arguments`
            const targs = tool.arguments || tool.args || {};
            const cleanStr = (v) => escapeHtmlRaw(typeof v === 'string' ? v.replace(/^"+|"+$/g, '') : JSON.stringify(v));
            const prettyName = escapeHtmlRaw(tool.name).replace(/_/g, ' ').toUpperCase();

            text += '<div id="inspector-title" style="color:'+titleColor+'">' + icon + prettyName + '</div>';

            // Human-readable headline: what the agent is doing, in plain English.
            const headline = targs.toolSummary || targs.toolAction;
            const subline = (targs.toolSummary && targs.toolAction) ? targs.toolAction : null;
            if (headline) {
                text += '<div class="inspector-section"><div class="inspector-label">What happened</div>' +
                        '<div style="background:var(--secondary,#f8f9fa); border:1px solid var(--border,#eee); border-left:4px solid '+titleColor+'; border-radius:6px; padding:14px;">' +
                        '<div style="font-size:15px; font-weight:600; color:var(--foreground,#202124);">' + cleanStr(headline) + '</div>' +
                        (subline ? '<div style="font-size:13px; color:var(--muted-foreground,#5f6368); margin-top:4px;">' + cleanStr(subline) + '</div>' : '') +
                        '</div></div>';
            }

            // Remaining arguments shown as a friendly label/value list instead of JSON.
            const skip = { toolAction: 1, toolSummary: 1 };
            const detailKeys = Object.keys(targs).filter(k => !skip[k]);
            if (detailKeys.length) {
                let rows = '';
                detailKeys.forEach(k => {
                    const label = escapeHtmlRaw(k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' '));
                    let val = targs[k];
                    if (typeof val === 'object') val = JSON.stringify(val, null, 2);
                    val = cleanStr(val);
                    rows += '<div style="padding:8px 0; border-bottom:1px solid var(--border,#f1f3f4);">' +
                            '<div style="font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted-foreground,#80868b);">' + label + '</div>' +
                            '<div style="font-size:13px; color:var(--foreground,#202124); word-break:break-word; white-space:pre-wrap;">' + val + '</div></div>';
                });
                text += '<div class="inspector-section"><div class="inspector-label">Details</div>' + rows + '</div>';
            }

            // The tool's actual output, paired from the following GENERIC step.
            const timing = parseTiming(data.result, data.step, data.resultStep);
            if (data.running) {
                text += '<div class="inspector-section"><div class="inspector-label">Result</div>' +
                        '<div style="background:'+warnBg+'; border:1px solid #F9AB00; border-radius:6px; padding:12px; font-size:13px; color:'+warnText+';">' +
                        '⏳ Still running — no result recorded yet.</div></div>';
            } else if (data.result) {
                const accent = data.failed ? '#D93025' : '#34A853';
                const bg = data.failed ? errBg : 'var(--secondary,#f8f9fa)';
                const summary = summarizeResult(data.result, tool.name, data.failed);

                // Duration is shown as a chip next to the section label, turning
                // red once a call crosses the "this is a bottleneck" threshold.
                let durChip = '';
                if (timing) {
                    const slow = timing.ms >= SLOW_MS;
                    durChip = '<span style="margin-left:8px; font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; ' +
                              'padding:2px 7px; border-radius:10px; ' +
                              (slow ? 'background:'+errBg+'; color:'+errText+';' : 'background:var(--secondary,#e8f0fe); color:var(--muted-foreground,#5f6368);') +
                              '" title="Time taken by this tool call">' + (slow ? '🐢 ' : '⏱ ') + formatDuration(timing.ms) + '</span>';
                }

                text += '<div class="inspector-section"><div class="inspector-label">' +
                        (data.failed ? 'Result — failed' : 'Result') + durChip + '</div>';

                if (summary) {
                    const chips = summary.stats.map(s =>
                        '<span style="display:inline-block; background:' + (isDarkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)') + '; border-radius:10px; padding:2px 8px; font-size:11px; color:var(--muted-foreground,#5f6368); margin:6px 6px 0 0;">' +
                        escapeHtmlRaw(s) + '</span>').join('');
                    text += '<div style="background:' + bg + '; border:1px solid var(--border,#eee); border-left:4px solid ' + accent + '; border-radius:6px; padding:14px;">' +
                            '<div style="font-size:14px; font-weight:600; color:var(--foreground,#202124); line-height:1.45;">' +
                            escapeHtmlRaw(summary.headline) + '</div>' + chips + '</div>';

                    // Full output stays one click away for anyone who needs it.
                    text += '<details style="margin-top:10px;">' +
                            '<summary style="cursor:pointer; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-foreground,#80868b); outline:none;">Show full output</summary>' +
                            '<div style="margin-top:8px; background:' + bg + '; border:1px solid var(--border,#eee); border-radius:6px; padding:12px; font-size:12px; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow-y:auto; font-family:ui-monospace, monospace; color:var(--foreground,#202124);">' +
                            escapeHtmlRaw(truncate(summary.body, 4000)) + '</div></details>';
                }
                text += truncationNotice(data.resultStep) + '</div>';
            }
        }
        
        text += '<details class="inspector-section" style="margin-top:24px; border-top:1px solid var(--border,#e8eaed); padding-top:16px;">' +
                    '<summary style="cursor:pointer; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted-foreground,#80868b); outline:none;">Advanced: Raw Trace Data</summary>' +
                    '<pre style="margin-top:12px; background:var(--secondary,#f8f9fa); background:rgba(0,0,0,0.03); max-height:250px;">' + escapeHtmlRaw(JSON.stringify(data, null, 2)) + '</pre></details>';
        
        inspectorEl.innerHTML = text;
    }

    window.showExplanation = function(lane) {
        let titleColor, icon, title, desc, examples;
        if (lane === 'actions') {
            titleColor = '#F57C00'; icon = '🏃'; title = 'ACTIONS (TRIGGER)';
            desc = 'This swimlane tracks the macro impulses that drive the entire workflow. It surfaces direct <strong>User Prompts</strong>, manual requests, and final conclusions that kick off a tracing cycle. It strictly represents <em>what</em> needs to be done.';
            examples = '<ul><li>A user typing a new prompt (<code>USER_INPUT</code>)</li><li>System-triggered context shifts</li><li>Final output delivery</li></ul>';
        } else if (lane === 'agent') {
            titleColor = '#8E24AA'; icon = '🧠'; title = 'MULTI-AGENT WORKFLOW';
            desc = 'This swimlane represents the cognitive routing layer. It maps directly to <strong>PLANNER_RESPONSE</strong> events where the agent explores context, synthesizes information, and explicitly formulates its operational plan. It represents <em>how</em> to accomplish the task through pure reasoning.';
            examples = '<ul><li>Chain of thought logic</li><li>Evaluating goal criteria</li><li>Delegation decisions before subagents</li></ul>';
        } else if (lane === 'tools') {
            titleColor = '#00BCD4'; icon = '🔧'; title = 'TOOLS & FUNCTIONS';
            desc = 'This swimlane is the physical execution tier. Any time the agent interacts with the environment or reaches out to an external system, a functional node is spawned here. This isolates pure thought from physical actions.';
            examples = '<ul><li>Executing bash commands (<code>run_command</code>)</li><li>Modifying files (<code>replace_file_content</code>)</li><li>Branching asynchronously (<code>invoke_subagent</code>)</li><li>Web scraping & search</li></ul>';
        }
        
        let text = '<div id="inspector-title" style="color:'+titleColor+'; cursor:default;">' + icon + ' ' + title + '</div>' +
                   '<div class="inspector-section"><div class="inspector-label">Swimlane Architecture</div>' + 
                   '<div class="markdown-body" style="font-size: 13px; background:var(--secondary, #f8f9fa); padding: 12px; border-radius: 6px; border: 1px solid var(--border, #eee);">' + desc + '</div></div>' +
                   '<div class="inspector-section"><div class="inspector-label">Events logged here</div>' + 
                   '<div class="markdown-body" style="font-size: 13px;">' + examples + '</div></div>';
        
        inspectorEl.innerHTML = text;
    };
</script>
</body>
</html>
