                            '<div style="font-size:14px; font-weight:600; color:var(--foreground,#202124); line-height:1.45;">' +
                            escapeHtmlRaw(summary.headline) + '</div>' + chips + '</div>';

                    // Full output stays one click away for anyone who needs it.
                    text += '<details style="margin-top:10px;">' +
                            '<summary style="cursor:pointer; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-foreground,#80868b); outline:none;">Show full output</summary>' +
                            '<div style="margin-top:8px; background:' + bg + '; border:1px solid var(--border,#eee); border-radius:6px; padding:12px; font-size:12px; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow-y:auto; font-family:ui-monospace, monospace; color:var(--foreground,#202124);">' +
                            escapeHtmlRaw(truncate(summary.body, 4000)) + '</div></details>';
                }
                text += truncationNotice(data.resultStep) + '</div>';
            }
        }
        
        text += '<details class="inspector-section" style="margin-top:24px; border-top:1px solid var(--border,#e8eaed); padding-top:16px;">' +
                    '<summary style="cursor:pointer; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted-foreground,#80868b); outline:none;">Advanced: Raw Trace Data</summary>' +
                    '<pre style="margin-top:12px; background:var(--secondary,#f8f9fa); background:rgba(0,0,0,0.03); max-height:250px;">' + escapeHtmlRaw(JSON.stringify(data, null, 2)) + '</pre></details>';
        
        inspectorEl.innerHTML = text;
    }

    window.showExplanation = function(lane) {
        let titleColor, icon, title, desc, examples;
        if (lane === 'actions') {
            titleColor = '#F57C00'; icon = '🏃'; title = 'ACTIONS (TRIGGER)';
            desc = 'This swimlane tracks the macro impulses that drive the entire workflow. It surfaces direct <strong>User Prompts</strong>, manual requests, and final conclusions that kick off a tracing cycle. It strictly represents <em>what</em> needs to be done.';
            examples = '<ul><li>A user typing a new prompt (<code>USER_INPUT</code>)</li><li>System-triggered context shifts</li><li>Final output delivery</li></ul>';
        } else if (lane === 'agent') {
            titleColor = '#8E24AA'; icon = '🧠'; title = 'MULTI-AGENT WORKFLOW';
            desc = 'This swimlane represents the cognitive routing layer. It maps directly to <strong>PLANNER_RESPONSE</strong> events where the agent explores context, synthesizes information, and explicitly formulates its operational plan. It represents <em>how</em> to accomplish the task through pure reasoning.';
            examples = '<ul><li>Chain of thought logic</li><li>Evaluating goal criteria</li><li>Delegation decisions before subagents</li></ul>';
        } else if (lane === 'tools') {
            titleColor = '#00BCD4'; icon = '🔧'; title = 'TOOLS & FUNCTIONS';
            desc = 'This swimlane is the physical execution tier. Any time the agent interacts with the environment or reaches out to an external system, a functional node is spawned here. This isolates pure thought from physical actions.';
            examples = '<ul><li>Executing bash commands (<code>run_command</code>)</li><li>Modifying files (<code>replace_file_content</code>)</li><li>Branching asynchronously (<code>invoke_subagent</code>)</li><li>Web scraping & search</li></ul>';
        }
        
        let text = '<div id="inspector-title" style="color:'+titleColor+'; cursor:default;">' + icon + ' ' + title + '</div>' +
                   '<div class="inspector-section"><div class="inspector-label">Swimlane Architecture</div>' + 
                   '<div class="markdown-body" style="font-size: 13px; background:var(--secondary, #f8f9fa); padding: 12px; border-radius: 6px; border: 1px solid var(--border, #eee);">' + desc + '</div></div>' +
                   '<div class="inspector-section"><div class="inspector-label">Events logged here</div>' + 
                   '<div class="markdown-body" style="font-size: 13px;">' + examples + '</div></div>';
        
        inspectorEl.innerHTML = text;
    };
</script>
</body>
</html>
